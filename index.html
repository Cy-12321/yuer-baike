<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>育儿百科</title>
  <style>
    /* ===== 温暖奶咖风：米白打底，奶黄/浅橙点缀，暖棕文字 ===== */
    :root {
      --bg: #FAF6EF;          /* 背景米白，不是纯白 */
      --card: #FFFFFF;        /* 卡片白，浮在米白上 */
      --text: #4A3A30;        /* 暖棕文字，不用纯黑 */
      --text-soft: #8A776A;   /* 次要文字 */
      --accent: #E5975B;      /* 浅橙：按钮、选中态 */
      --accent-dark: #D4833F; /* 浅橙按下 */
      --cream: #FBE8C8;       /* 奶黄：点缀、话术底色 */
      --line: #EFE4D6;        /* 描边 */
      --shadow: 0 4px 16px rgba(150, 110, 70, 0.10);
      --shadow-lift: 0 8px 24px rgba(150, 110, 70, 0.16);
    }

    /* ===== 全局：圆润字体 + 偏大字号 ===== */
    html, body {
      margin: 0;
      touch-action: manipulation;   /* 手机端禁止双击缩放（快速点按钮不放大页面） */
    }
    body {
      text-align: center;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei",
                   "Hiragino Sans GB", system-ui, -apple-system, sans-serif;
      font-size: 17px;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }
    .block {
      margin: 40px auto;
      padding: 0 16px;
      max-width: 720px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin: 8px 0;
    }

    /* ===== ① 顶栏 ===== */
    header.block {
      background: linear-gradient(180deg, #FDF1DD 0%, var(--bg) 100%);
      border-radius: 0 0 28px 28px;
      margin-top: 0;
      padding: 40px 20px 32px;
      max-width: none;
    }
    header h1 {
      margin: 0 0 10px;
      font-size: 34px;
      letter-spacing: 1px;
    }
    header p {
      margin: 0;
      color: var(--text-soft);
      font-size: 16px;
    }

    /* ===== ② 搜索框 + 搜索按钮 ===== */
    /* 输入框和麦克风挤在一行，行宽 = 原来输入框的宽度 */
    .input-row {
      display: inline-flex;
      align-items: center;
      width: min(400px, 100%);
    }
    #search-input {
      flex: 1 1 auto;
      min-width: 0;
      box-sizing: border-box;
      padding: 13px 20px;
      font-size: 16px;          /* 不小于16px，手机上不会被自动放大 */
      font-family: inherit;
      color: var(--text);
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 999px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      box-shadow: var(--shadow);
      transition: border-color .2s, box-shadow .2s;
    }
    #search-input::placeholder {
      color: #BCAB9C;
    }
    #search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(229, 151, 91, 0.18);
    }
    #search-btn {
      margin-left: 10px;
      padding: 13px 30px;
      font-size: 16px;
      font-family: inherit;
      font-weight: bold;
      color: #FFFFFF;
      background: var(--accent);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: background .2s, transform .1s, box-shadow .2s;
    }
    #search-btn:hover {
      background: var(--accent-dark);
      box-shadow: var(--shadow-lift);
    }
    #search-btn:active {
      transform: translateY(1px);
    }

    /* ===== ②.5 语音输入：麦克风按钮 + 按住说话 ===== */
    #mic-btn {
      flex: none;
      margin-left: 8px;
      width: 50px;
      height: 50px;
      padding: 0;
      font-size: 22px;
      line-height: 1;
      color: var(--accent-dark);
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: border-color .2s, box-shadow .2s, transform .1s;
    }
    #mic-btn:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-lift);
    }
    #mic-btn:active {
      transform: translateY(1px);
    }

    /* 语音模式：搜索框位置换成「按住说话」+ 取消按钮 */
    .voice-row {
      display: none;
    }
    .voice-mode .input-row,
    .voice-mode #search-btn {
      display: none;
    }
    .voice-mode .voice-row {
      display: flex;
      width: min(400px, 100%);
      margin: 0 auto;
    }
    #hold-speak-btn {
      flex: 1 1 auto;
      min-height: 58px;
      padding: 0 24px;
      font-size: 18px;
      font-weight: bold;
      font-family: inherit;
      color: var(--accent-dark);
      background: var(--cream);
      border: 2px solid var(--accent);
      border-radius: 999px;
      cursor: pointer;
      box-shadow: var(--shadow);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      touch-action: none;            /* 按住时不让页面跟着滚动 */
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      transition: background .2s, color .2s, border-color .2s;
    }
    /* 按住中：变浅橙 + 呼吸光圈 */
    #hold-speak-btn.recording {
      color: #FFFFFF;
      background: var(--accent);
      border-color: var(--accent-dark);
      animation: mic-pulse 1.2s ease-out infinite;
    }
    @keyframes mic-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(229, 151, 91, 0.35); }
      100% { box-shadow: 0 0 0 14px rgba(229, 151, 91, 0); }
    }
    #voice-cancel-btn {
      flex: none;
      margin-left: 10px;
      width: 50px;
      font-size: 16px;
      font-family: inherit;
      color: var(--text-soft);
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: border-color .2s, color .2s, box-shadow .2s;
    }
    #voice-cancel-btn:hover {
      border-color: var(--accent);
      color: var(--accent-dark);
    }

    /* ===== ③ 4个年龄段按钮 ===== */
    #age-row {
      margin-top: 18px;
    }
    .age-btn {
      margin: 6px 5px;
      padding: 10px 20px;
      min-height: 44px;         /* 手指好点按 */
      font-size: 15px;
      font-family: inherit;
      color: var(--text-soft);
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      transition: background-color .2s, color .2s, border-color .2s, box-shadow .2s;
    }
    .age-btn:hover {
      border-color: var(--accent);
      color: var(--accent-dark);
    }
    /* 选中的年龄段按钮：填充浅橙 + 加粗 */
    .age-btn.active {
      font-weight: bold;
      color: #FFFFFF;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: var(--shadow);
    }

    /* ===== ④ 结果卡片：白卡浮在米白底上 ===== */
    .card {
      margin: 20px auto;
      padding: 24px 26px;
      text-align: left;         /* 大段文字左对齐才好读 */
      background: var(--card);
      border-radius: 20px;
      box-shadow: var(--shadow);
      transition: box-shadow .2s, transform .2s;
    }
    .card:hover {
      box-shadow: var(--shadow-lift);
      transform: translateY(-2px);
    }
    .card h3 {
      margin: 0 0 14px;
      padding-bottom: 12px;
      font-size: 21px;
      border-bottom: 2px dashed var(--line);
    }
    .card p {
      margin: 12px 0;
      font-size: 16.5px;
    }
    /* 第2个 p 固定是「话术」：奶黄底的小方块，家长一眼能找到 */
    .card p:nth-of-type(2) {
      padding: 14px 18px;
      background: var(--cream);
      border-left: 4px solid var(--accent);
      border-radius: 0 14px 14px 0;
    }
    /* 最后一个 p 固定是「出处」：弱化 */
    .card p:last-of-type {
      margin-bottom: 0;
      font-size: 14px;
      color: var(--text-soft);
    }
    /* 「没找到」提示（result-list 下直接的 p，不在卡片里） */
    #result-list > p {
      padding: 30px 0;
      color: var(--text-soft);
    }

    /* ===== AI 顾问卡片：复用 .card 外观，回答保持正常字号颜色 ===== */
    .ai-card p {
      white-space: pre-line;    /* 保留 AI 回答里的换行 */
    }
    .ai-card p:last-of-type {
      font-size: 16.5px;
      color: var(--text);
    }
    /* 占位卡：半透明一眼看出是临时的；失败后内容弱化成灰色小字 */
    .ai-card.ai-loading {
      opacity: 0.6;
    }
    .ai-card.ai-failed p:last-of-type {
      font-size: 14px;
      color: var(--text-soft);
    }

    /* ===== ⑤ 热门问题区 ===== */
    h2 {
      margin-bottom: 18px;
      font-size: 24px;
    }
    .hot-item {
      cursor: pointer;
      padding: 15px 20px;
      text-align: left;
      background: var(--card);
      border-radius: 14px;
      border-left: 4px solid var(--cream);
      box-shadow: var(--shadow);
      transition: background-color .2s, border-color .2s, transform .2s, box-shadow .2s;
    }
    .hot-item:hover {
      background: #FFFBF3;
      border-left-color: var(--accent);
      transform: translateX(4px);
      box-shadow: var(--shadow-lift);
    }

    /* ===== ⑥ 底部说明 ===== */
    footer.block {
      margin-bottom: 0;
      padding: 26px 20px 34px;
      border-top: 2px dashed var(--line);
      max-width: none;
    }
    footer p {
      margin: 0;
      font-size: 14px;
      color: var(--text-soft);
    }

    /* ===== 窄屏（手机）：卡片全宽、字号不缩、按钮好点 ===== */
    @media (max-width: 600px) {
      .block {
        margin: 28px auto;
        padding: 0 14px;
      }
      header h1 {
        font-size: 28px;
      }
      /* 搜索行占满，输入框和麦克风挤一行；搜索按钮另起一行，方便点 */
      .input-row {
        width: 100%;
      }
      #hold-speak-btn {
        min-height: 64px;   /* 手机上手大，按住说话的按钮再高点 */
      }
      #search-btn {
        width: 100%;
        margin: 12px 0 0;
        min-height: 48px;
      }
      .age-btn {
        margin: 5px 4px;
        padding: 10px 16px;
      }
      .card {
        margin: 16px 0;
        padding: 20px 18px;     /* 只收内边距，字号不动 */
        border-radius: 16px;
      }
      .card:hover {
        transform: none;        /* 手机没有悬停，别抖 */
      }
      .hot-item:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>

  <!-- ① 顶栏 -->
  <header class="block">
    <h1>🧒 育儿百科</h1>
    <p>科学育儿不焦虑：喂养、睡眠、情绪、习惯，一站式解答 0-12 岁育儿难题</p>
  </header>

  <!-- ② 搜索区 -->
  <section class="block" id="search-section">
    <div class="input-row">
      <input type="search" id="search-input" placeholder="搜关键词：哭闹、发烧、辅食">
      <button id="mic-btn" title="语音输入" aria-label="语音输入">🎤</button>
    </div>
    <button id="search-btn">搜索</button>
    <div class="voice-row" id="voice-row">
      <button id="hold-speak-btn">按住说话</button>
      <button id="voice-cancel-btn" title="退出语音输入" aria-label="退出语音输入">✕</button>
    </div>
    <div id="age-row">
      <button class="age-btn" data-age="0-1岁">0-1岁</button>
      <button class="age-btn" data-age="1-3岁">1-3岁</button>
      <button class="age-btn" data-age="3-6岁">3-6岁</button>
      <button class="age-btn" data-age="6-12岁">6-12岁</button>
    </div>
  </section>

  <!-- ③ 结果区 -->
  <section class="block">
    <!-- 结果卡片将显示在这里 -->
    <div id="result-list"></div>
  </section>

  <!-- ④ 热门问题专区 -->
  <section class="block">
    <h2>热门问题</h2>
    <ul>
      <li class="hot-item" data-keyword="发烧">宝宝发烧了，先物理降温还是直接吃药？</li>
      <li class="hot-item" data-keyword="辅食">宝宝辅食怎么加？第一口吃什么？</li>
      <li class="hot-item" data-keyword="湿疹">宝宝湿疹反反复复，怎么护理？</li>
      <li class="hot-item" data-keyword="半夜哭闹">0-1岁宝宝半夜哭闹，是饿还是不舒服？</li>
      <li class="hot-item" data-keyword="上幼儿园哭闹">3-6岁孩子上幼儿园哭闹，怎么安抚？</li>
      <li class="hot-item" data-keyword="写作业拖拉">6-12岁孩子写作业拖拉，怎么破？</li>
    </ul>
  </section>

  <!-- ⑤ 底部：数据来源说明 -->
  <footer class="block">
    <p>数据来源：精选 10 本育儿书（如《美国儿科学会育儿百科》《西尔斯亲密育儿百科》《正面管教》等）</p>
  </footer>

  <!-- 知识库数据 -->
  <script src="data.js"></script>

  <!-- 搜索功能 -->
  <script>
    var input = document.getElementById('search-input');
    var btn = document.getElementById('search-btn');
    var resultList = document.getElementById('result-list');
    var ageBtns = document.querySelectorAll('.age-btn');
    var hotItems = document.querySelectorAll('.hot-item');
    var selectedAge = '';  // 空 = 没筛年龄段
    var aiSeq = 0;  // 每重新渲染一次就 +1，用来作废还没返回的 AI 回答
    var lastSearchFromVoice = false;  // 语音提问标记：只有语音识别成功会设 true，用完立刻归位 false（手动搜索永远不读）

    // 生成一张结果卡片
    function createCard(item) {
      var card = document.createElement('div');
      card.className = 'card';

      var question = document.createElement('h3');
      question.textContent = item.question;
      card.appendChild(question);

      var advice = document.createElement('p');
      advice.textContent = item.advice;
      card.appendChild(advice);

      var script = document.createElement('p');
      script.textContent = '你可以这样说：' + item.script;
      card.appendChild(script);

      // 故事有内容才显示
      if (item.story) {
        var story = document.createElement('p');
        story.textContent = item.story;
        card.appendChild(story);
      }

      var source = document.createElement('p');
      source.textContent = '出处：' + item.source;
      card.appendChild(source);

      return card;
    }

    // 按「关键词 + 年龄段」出结果：问题里包含关键词就算匹配
    // 第一优先：整句关键词直接匹配；一条都没中时，
    // 按 4字→3字→2字 滑动拆词，用命中的小词再搜一轮
    function render() {
      aiSeq++;
      stopReading();  // 结果区要换了：正在播的答案朗读立刻停（防串台）
      var keyword = input.value.trim();
      resultList.textContent = '';

      // 没输关键词也没选年龄段，就保持初始的空白状态
      if (!keyword && !selectedAge) return;

      var matched = searchItems(keyword);

      // 整句搜不到时，自动拆成小词再搜
      if (matched.length === 0 && keyword) {
        matched = searchByWords(keyword);
      }

      if (matched.length === 0) {
        var tip = document.createElement('p');
        tip.textContent = '没找到，试试更短的关键词，比如：哭闹、发烧';
        resultList.appendChild(tip);
        return;
      }

      matched.forEach(function (item) {
        resultList.appendChild(createCard(item));
      });
    }

    // 原匹配：question 包含关键词（外加年龄段筛选）
    function searchItems(keyword) {
      return KNOWLEDGE.filter(function (item) {
        var hitKeyword = !keyword || item.question.indexOf(keyword) !== -1;
        var hitAge = !selectedAge || item.age === selectedAge;
        return hitKeyword && hitAge;
      });
    }

    // 拆词搜索：把输入按 4字→3字→2字 滑动切成小词，
    // 只留出现在任意 question 里的词（去重，按长度从长到短），
    // 再用这些词匹配条目；命中的词越长，条目越靠前
    function searchByWords(keyword) {
      // 1. 滑动切词：4字、3字、2字各切一遍
      var words = [];
      [4, 3, 2].forEach(function (len) {
        for (var i = 0; i + len <= keyword.length; i++) {
          var word = keyword.substr(i, len);
          if (words.indexOf(word) === -1) words.push(word);
        }
      });

      // 2. 只留真正在某个 question 里出现过的词，按长度从长到短
      var hitWords = words.filter(function (word) {
        return KNOWLEDGE.some(function (item) {
          return item.question.indexOf(word) !== -1;
        });
      }).sort(function (a, b) {
        return b.length - a.length;
      });

      if (hitWords.length === 0) return [];

      // 3. 用命中的词匹配条目，记下每条命中的最长词长度
      var hits = [];
      KNOWLEDGE.forEach(function (item) {
        if (selectedAge && item.age !== selectedAge) return;
        var bestLen = 0;
        hitWords.forEach(function (word) {
          if (word.length > bestLen && item.question.indexOf(word) !== -1) {
            bestLen = word.length;
          }
        });
        if (bestLen > 0) hits.push({ item: item, len: bestLen });
      });

      // 4. 命中的词越长越靠前
      hits.sort(function (a, b) { return b.len - a.len; });
      return hits.map(function (h) { return h.item; });
    }

    // ===== AI 育儿顾问：AI 优先、查表兜底 =====
    var AI_URL = 'https://1475519707-gva630d36e.ap-beijing.tencentscf.com';
    var AI_TIMEOUT = 15000;  // 15 秒没返回就当 AI 失败，保持查表结果

    // 向 AI 育儿顾问提问：成功且 answer 非空返回文本，否则返回空字符串
    function askAI(question, age) {
      return new Promise(function (resolve) {
        var done = false;
        var controller = null;
        if (typeof AbortController !== 'undefined') {
          controller = new AbortController();
        }

        // 超时同样走兜底：当作 AI 失败
        var timer = setTimeout(function () {
          if (done) return;
          done = true;
          if (controller) controller.abort();
          resolve('');
        }, AI_TIMEOUT);

        fetch(AI_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: question, age: age }),
          signal: controller ? controller.signal : undefined
        }).then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        }).then(function (data) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          var answer = data && typeof data.answer === 'string' ? data.answer.trim() : '';
          resolve(answer);
        }).catch(function () {
          if (done) return;
          done = true;
          clearTimeout(timer);
          resolve('');
        });
      });
    }

    // AI 占位卡：外观跟知识库卡片一致，顶部标一行顾问名；
    // 一开始半透明显示"正在思考…"，回答回来后原地改文字
    function createAICard() {
      var card = document.createElement('div');
      card.className = 'card ai-card ai-loading';

      var title = document.createElement('h3');
      title.textContent = '🧑🏫 AI 育儿顾问';
      card.appendChild(title);

      var answerP = document.createElement('p');
      answerP.textContent = '正在思考…';
      card.appendChild(answerP);

      return card;
    }

    // 搜索主流程：先照原查表逻辑出结果，同时在结果区最顶部插一张 AI 占位卡；
    // AI 答上来就把占位卡文字原地换成回答，没答上来就换成一句灰色小字
    function searchWithAI() {
      var fromVoice = lastSearchFromVoice;  // 本次提问是否来自语音
      lastSearchFromVoice = false;          // 只认这一次，下次搜索默认手动
      render();
      var keyword = input.value.trim();
      if (!keyword) return;  // 没关键词就不问 AI，保持以前的空白/只看年龄段行为

      var placeholder = createAICard();
      resultList.insertBefore(placeholder, resultList.firstChild);

      var seq = aiSeq;
      askAI(keyword, selectedAge).then(function (answer) {
        if (seq !== aiSeq) return;  // 期间又搜索了一次：旧占位卡已被清掉，什么都不做
        var answerP = placeholder.querySelector('p');
        placeholder.classList.remove('ai-loading');
        if (answer) {
          answerP.textContent = answer;
          if (fromVoice) readAnswerAloud(answer);  // 语音提问的答案：自动朗读一遍
        } else {
          answerP.textContent = 'AI 顾问暂时没接上，先看下面的知识库答案';
          placeholder.classList.add('ai-failed');
        }
      });
    }

    btn.addEventListener('click', searchWithAI);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') searchWithAI();
    });

    // 只让当前选中的年龄段按钮加粗
    function updateAgeButtons() {
      Array.prototype.forEach.call(ageBtns, function (b) {
        if (b.getAttribute('data-age') === selectedAge) {
          b.classList.add('active');
        } else {
          b.classList.remove('active');
        }
      });
    }

    // 年龄段筛选：点一下选中，再点同一个取消
    Array.prototype.forEach.call(ageBtns, function (ageBtn) {
      ageBtn.addEventListener('click', function () {
        var age = ageBtn.getAttribute('data-age');
        selectedAge = (selectedAge === age) ? '' : age;
        updateAgeButtons();
        render();
      });
    });

    // 热门问题：点标题 = 填关键词 + 清掉年龄段筛选，保证一定看到这条答案
    Array.prototype.forEach.call(hotItems, function (hotItem) {
      hotItem.addEventListener('click', function () {
        input.value = hotItem.getAttribute('data-keyword');
        selectedAge = '';
        updateAgeButtons();
        render();
      });
    });
  </script>

  <!-- 语音输入：按住说话 → 网页录音 → 腾讯云 ASR 转文字（不挑浏览器、不走谷歌） -->
  <script>
    var searchSection = document.getElementById('search-section');
    var micBtn = document.getElementById('mic-btn');
    var voiceCancelBtn = document.getElementById('voice-cancel-btn');
    var holdBtn = document.getElementById('hold-speak-btn');

    var stream = null;      // 麦克风流：语音模式期间拿着，退出时释放（不让麦克风一直亮）
    var micPending = false; // 正在向浏览器要麦克风权限
    var recorder = null;    // 正在录音的 MediaRecorder
    var chunks = [];        // 这次录音攒下的音频块
    var recording = false;  // 是否正在按住录音
    var busy = false;       // 松手后识别中：忽略再次按住
    var abortReason = null; // 非空 = 这次录音作废（toolong / cancel）
    var maxTimer = null;    // 30 秒上限计时器
    var hintTimer = null;   // 提示文字自动复原的计时器
    var voiceSeq = 0;       // 每次进语音模式 +1，作废还没回来的识别结果

    // 浏览器不支持录音：藏起麦克风按钮，其余功能不受影响
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
      micBtn.style.display = 'none';
    } else {
      micBtn.addEventListener('click', enterVoiceMode);
      voiceCancelBtn.addEventListener('click', cancelVoice);
      holdBtn.addEventListener('pointerdown', startHold);
      holdBtn.addEventListener('pointerup', endHold);
      holdBtn.addEventListener('pointercancel', endHold);
      // 手机上长按不弹出菜单
      holdBtn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      // 录音中切后台：自动结束录音
      document.addEventListener('visibilitychange', function () {
        if (document.hidden && recording) endHold();
      });
    }

    // ===== 语音模式开关 =====
    function enterVoiceMode() {
      voiceSeq++;  // 作废上一轮还没回来的结果
      clearTimeout(hintTimer);
      resetHoldBtn();
      searchSection.classList.add('voice-mode');
      // http 页面（非本机）拿不到麦克风，直接提示
      if (location.protocol === 'http:' &&
          location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        showHint('需要 HTTPS 才能用语音');
        return;
      }
      tryGetMic();
    }
    function exitVoiceMode() {
      searchSection.classList.remove('voice-mode');
      releaseMic();
    }
    function resetHoldBtn() {
      holdBtn.classList.remove('recording');
      holdBtn.textContent = '按住说话';
    }
    // 在按钮上显示一句提示，2 秒后复原
    function showHint(text) {
      holdBtn.classList.remove('recording');
      holdBtn.textContent = text;
      clearTimeout(hintTimer);
      hintTimer = setTimeout(resetHoldBtn, 2000);
    }
    // 要麦克风（浏览器会弹权限框；给过一次后都是静默拿）
    function tryGetMic() {
      if (stream || micPending) return;
      micPending = true;
      navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
      }).then(function (s) {
        stream = s;
        micPending = false;
      }).catch(function () {
        micPending = false;
        showHint('没有麦克风权限，请在浏览器设置里允许');
      });
    }
    function releaseMic() {
      if (stream) {
        stream.getTracks().forEach(function (t) { t.stop(); });
        stream = null;
      }
    }

    // ===== 按住说话 =====
    function startHold(e) {
      if (busy || recording) return;
      if (e.button !== undefined && e.button !== 0) return;  // 只认左键/单指
      if (!stream) {
        if (micPending) showHint('麦克风准备中…');
        else showHint('没有麦克风权限，请在浏览器设置里允许');
        return;
      }
      // 手指滑出按钮也能收到松手事件
      if (holdBtn.setPointerCapture) {
        try { holdBtn.setPointerCapture(e.pointerId); } catch (err) {}
      }
      recording = true;
      abortReason = null;
      chunks = [];
      holdBtn.textContent = '松开结束';
      holdBtn.classList.add('recording');

      try {
        recorder = new MediaRecorder(stream);
      } catch (err) {
        recording = false;
        showHint('录音启动失败，再试一次');
        return;
      }
      var rec = recorder;
      rec.ondataavailable = function (ev) {
        if (recorder !== rec) return;  // 旧录音的尾巴，别掺进新录音
        if (ev.data && ev.data.size) chunks.push(ev.data);
      };
      rec.onstop = function () {
        if (recorder !== rec) return;
        recorder = null;
        if (abortReason) {
          var reason = abortReason;
          abortReason = null;
          if (reason === 'toolong') showHint('太长了，30 秒内说完');
          return;
        }
        processRecording();  // 松手（或切后台）→ 识别
      };
      rec.start();
      // 30 秒上限：自动结束，不识别
      maxTimer = setTimeout(function () {
        if (!recording) return;
        recording = false;
        abortReason = 'toolong';
        holdBtn.classList.remove('recording');
        stopRecorder();
      }, 30000);
    }

    function endHold() {
      if (!recording || !recorder) return;
      recording = false;
      busy = true;
      holdBtn.classList.remove('recording');
      holdBtn.textContent = '识别中…';
      stopRecorder();
    }

    function stopRecorder() {
      if (maxTimer) { clearTimeout(maxTimer); maxTimer = null; }
      if (recorder && recorder.state === 'recording') {
        try { recorder.stop(); } catch (err) {}
      }
    }

    // 取消：停录音、放麦克风、回到搜索框
    function cancelVoice() {
      voiceSeq++;  // 作废识别中/还没回来的结果
      if (recording) {
        recording = false;
        abortReason = 'cancel';
        holdBtn.classList.remove('recording');
        stopRecorder();
      }
      busy = false;
      exitVoiceMode();
      resetHoldBtn();
    }

    // ===== 音频加工：录音 Blob → 16kHz 单声道 WAV base64 → 云端识别 =====
    function processRecording() {
      var blob = new Blob(chunks);
      chunks = [];
      var seq = voiceSeq;
      blob.arrayBuffer().then(function (buf) {
        var ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        return ctx.decodeAudioData(buf).then(function (audio) {
          ctx.close();
          return audioToWavBase64(audio);
        });
      }).then(function (base64) {
        return askASR(base64);
      }).then(function (text) {
        busy = false;
        if (seq !== voiceSeq) return;  // 期间取消/重进过语音模式：结果作废
        if (text) {
          input.value = text;
          exitVoiceMode();
          lastSearchFromVoice = true;  // 这次是语音提问：AI 答案出来后自动朗读
          searchWithAI();  // 跟手动输入后按回车一样（含 AI 顾问卡）
        } else {
          showHint('没听清，请手动输入');
        }
      }).catch(function () {
        busy = false;
        if (seq !== voiceSeq) return;
        showHint('没听清，请手动输入');
      });
    }

    // 解码后的音频 → 16kHz 单声道 16bit PCM → 标准 WAV（44 字节头）→ base64
    function audioToWavBase64(audioBuffer) {
      var data = audioBuffer.getChannelData(0);
      var srcRate = audioBuffer.sampleRate;
      var dstRate = 16000;
      var pcm;
      if (srcRate === dstRate) {
        pcm = new Int16Array(data.length);
        for (var i = 0; i < data.length; i++) {
          pcm[i] = toInt16(data[i]);
        }
      } else {
        // 采样率对不上：线性插值重采样到 16kHz
        var dstLen = Math.max(1, Math.round(data.length * dstRate / srcRate));
        pcm = new Int16Array(dstLen);
        for (var j = 0; j < dstLen; j++) {
          var pos = j * srcRate / dstRate;
          var i0 = Math.floor(pos);
          var i1 = Math.min(i0 + 1, data.length - 1);
          var frac = pos - i0;
          pcm[j] = toInt16(data[i0] * (1 - frac) + data[i1] * frac);
        }
      }
      function toInt16(s) {
        s = Math.max(-1, Math.min(1, s));
        return s < 0 ? s * 0x8000 : s * 0x7FFF;
      }

      // 44 字节 WAV 头（RIFF / fmt / data），16kHz 单声道 16bit PCM
      var header = new ArrayBuffer(44);
      var dv = new DataView(header);
      function writeStr(offset, str) {
        for (var k = 0; k < str.length; k++) dv.setUint8(offset + k, str.charCodeAt(k));
      }
      writeStr(0, 'RIFF');
      dv.setUint32(4, 36 + pcm.length * 2, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      dv.setUint32(16, 16, true);           // fmt 块长度
      dv.setUint16(20, 1, true);            // PCM
      dv.setUint16(22, 1, true);            // 单声道
      dv.setUint32(24, dstRate, true);      // 采样率
      dv.setUint32(28, dstRate * 2, true);  // 字节率
      dv.setUint16(32, 2, true);            // 块对齐
      dv.setUint16(34, 16, true);           // 位深
      writeStr(36, 'data');
      dv.setUint32(40, pcm.length * 2, true);

      // 拼接成 Uint8Array，分块转 base64（一次转太长会卡）
      var bytes = new Uint8Array(44 + pcm.length * 2);
      bytes.set(new Uint8Array(header), 0);
      bytes.set(new Uint8Array(pcm.buffer), 44);
      var binary = '';
      var CHUNK = 0x8000;
      for (var i = 0; i < bytes.length; i += CHUNK) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
      }
      return btoa(binary);
    }

    // ===== 调腾讯云函数做一句话识别（沿用 AI 的 15 秒超时，失败返回空文字） =====
    function askASR(audioBase64) {
      return new Promise(function (resolve) {
        var done = false;
        var controller = null;
        if (typeof AbortController !== 'undefined') {
          controller = new AbortController();
        }
        var timer = setTimeout(function () {
          if (done) return;
          done = true;
          if (controller) controller.abort();
          resolve('');
        }, AI_TIMEOUT);

        fetch(AI_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'asr', audio: audioBase64 }),
          signal: controller ? controller.signal : undefined
        }).then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        }).then(function (data) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          var text = data && typeof data.text === 'string' ? data.text.trim() : '';
          resolve(text);
        }).catch(function () {
          if (done) return;
          done = true;
          clearTimeout(timer);
          resolve('');
        });
      });
    }
  </script>

  <!-- 答案朗读：语音提问 → AI 答案 → 腾讯云 TTS 温柔女声 → 自动播一遍（失败全程静默） -->
  <script>
    var readingAudio = null;  // 正在播的这段音频：新搜索一来就掐断
    var ttsSeq = 0;           // 每掐断一次 +1，作废还没开播的旧朗读

    // 立刻停掉正在播的答案朗读（新搜索、新答案都走这里）
    function stopReading() {
      ttsSeq++;
      if (readingAudio) {
        try { readingAudio.pause(); } catch (err) {}
        readingAudio = null;
      }
    }

    // AI 答案出来后：拿文字去云端合成，合成好了一段段连播；
    // 超时 / 空数组 / 播放报错都静默，不打扰看答案
    function readAnswerAloud(text) {
      stopReading();
      var seq = ttsSeq;
      askTTS(text).then(function (audios) {
        if (seq !== ttsSeq) return;             // 期间又搜索了：这次不播
        if (!audios || !audios.length) return;  // 合成失败：静默兜底
        playAudios(audios, seq);
      });
    }

    // 调腾讯云函数做语音合成（沿用 AI 的 15 秒超时，失败返回空数组）
    function askTTS(text) {
      return new Promise(function (resolve) {
        var done = false;
        var controller = null;
        if (typeof AbortController !== 'undefined') {
          controller = new AbortController();
        }
        var timer = setTimeout(function () {
          if (done) return;
          done = true;
          if (controller) controller.abort();
          resolve([]);
        }, AI_TIMEOUT);

        fetch(AI_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'tts', text: text, voice: '101007' }),
          signal: controller ? controller.signal : undefined
        }).then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        }).then(function (data) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          var audios = data && Array.isArray(data.audios) ? data.audios : [];
          resolve(audios);
        }).catch(function () {
          if (done) return;
          done = true;
          clearTimeout(timer);
          resolve([]);
        });
      });
    }

    // 一段一段连着播：这段 ended 自动放下一段；播报错就当没这回事
    function playAudios(audios, seq) {
      var i = 0;
      function playNext() {
        if (seq !== ttsSeq) return;  // 新搜索来了：立即停
        if (i >= audios.length) { readingAudio = null; return; }  // 全部播完
        var audio = new Audio('data:audio/mp3;base64,' + audios[i]);
        i++;
        readingAudio = audio;
        audio.onended = playNext;  // 自动接下一段
        audio.onerror = function () {
          if (readingAudio === audio) readingAudio = null;
        };
        var p = audio.play();
        if (p && p.catch) {
          p.catch(function () {
            if (readingAudio === audio) readingAudio = null;
          });
        }
      }
      playNext();
    }
  </script>
